<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>For Loops</title>
</head>

<body>
  <script>
    const numbers = [2, 34, 3, 23, 42, 3, 1, 65, 364, 5, 645, 6];

    const name = 'Wes Bos';

    const me = {
      name: 'brody',
      age: 100,
      cool: true
    }

    const baseHumanStats = {
      feet: 2,
      arms: 2,
      eyes: 2,
      head: 1
    };


    function Human(name) {
      this.name = name;
    }

    Human.prototype = baseHumanStats;
    const meAgain = new Human('brody');

    // For
    for (let i = 0; i < numbers.length; i++) {
      console.log(numbers[i]);
    }

    // For of
    for (letters of name) {
      console.log(letters);
    }

    for (number of numbers) {
      console.log(number);
    }

    // For in
    for (number in numbers) {
      console.log(number);
    }

    for (prop in me) {
      console.log(prop);
    }

    // While Loop
    let cool = true;
    let i = 1;
    while (cool === true) {
      console.log('You are cool');
      i++
      if (i > 100) {
        cool = false;
      }
    }

  </script>
</body>

</html>
