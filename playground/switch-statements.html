<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="../base.css">
</head>


<body>
  <style>
    .turtle {
      position: relative;
      --x: 0px;
      --y: 0px;
      --rotateX: 0;
      --rotate: 0;
      transform: translateX(var(--x)) translateY(var(--y))
        rotateY(var(--rotateX)) rotate(var(--rotate));
      transition: transform 0.2s;
    }
  </style>
  <img src="./turtle.png" alt="turtle" class="turtle" width="200">
</body>

  <script>
      const turtle = document.querySelector('.turtle');
      let x = 0;
      let y = 0;
      const speed = 50;
      let flipped = false;
      let rotate = 0;

      function handleKeyDown(event) {
        if(!event.key.includes("Arrow")) {
          return;
        }

        switch (event.key) {
          case 'ArrowUp':
            y = y - 1;
            rotate = -90;
            break;
          case 'ArrowDown':
            y = y + 1;
            rotate = 90;
            break;
          case 'ArrowLeft':
            x = x - 1;
            flipped = true;
            rotate = 0;
            break;
          case 'ArrowRight':
            x = x + 1;
            flipped = false;
            rotate = 0;
            break;
          default:
            console.log("that is not a valid move");
            break;
        }

        turtle.setAttribute('style', `
          --rotateX: ${flipped ? '180deg' : '0'};
          --x: ${x * speed}px;
          --y: ${y * speed}px;
          --rotate: ${rotate}deg;
        `);
        // console.log(x, y);
      }

      window.addEventListener("keydown", handleKeyDown);

  </script>

</html>
