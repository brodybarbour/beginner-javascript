<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>New, This, Prototypes and Classes</title>
  <link rel="stylesheet" href="../base.css">
</head>

<body>

  <button class="one">Button 1</button>
  <button class="two">Button 2</button>

  <script>

    const myDate = new Date('August 11, 2025');
    console.dir(myDate);
    console.log(myDate.getFullYear());

    function Pizza(toppings = [], customer, id) {
      console.log('Making a pizza');
      this.toppings = toppings;
      this.customer = customer;
      this.id = Math.floor(Math.random() * 16777215).toString(16);
      this.slices = 10;
    }

    Pizza.prototype.eat = function() {
      if (this.slices > 0) {
        this.slices = this.slices - 1;
        console.log(`You now have ${this.slices} left`);
      } else {
        console.log('Sorry no slices left');
      }
    };

    Pizza.prototype.describle = function() {
      return `This pizza is for ${this.customer} with the toppings ${this.toppings.join(',')} and there are ${this.slices} left.`
    }

    Pizza.prototype.size = 'Large';

    const pepperoniPizza = new Pizza(['pepperoni', 'cheese'], 'Charles');
    const hawiianPizza = new Pizza(['pineapple', 'cheese'], 'Steven');
    console.log({pepperoniPizza});

    function tellMeAboutButton() {
      console.log('outside', this);
      // setTimeout(function() {
      //   console.log('inside', this);
      //   this.textConent = "You Clicked Me";
      // }, 1000);
      setTimeout(() => {
        console.log('inside', this);
        this.textContent = "You Clicked Me";
      }, 1000);
    }

    button1 = document.querySelector('.one');
    button2 = document.querySelector('.two');

    button1.addEventListener('click', tellMeAboutButton);
    button2.addEventListener('click', tellMeAboutButton);

  </script>
</body>

</html>
