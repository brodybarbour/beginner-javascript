  <script>
    function buzzer() {
      console.log("ENNNNNG!!!");
    }

    // setTimeout(buzzer, 500);

    function setImmediateInterval(funcToRun, ms) {
      //function that will immediately run:
      funcToRun();

      //function that fires on intervals
      return setInterval(funcToRun, ms);
    }
