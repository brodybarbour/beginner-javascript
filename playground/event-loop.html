<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Event Loop</title>
  <link rel="stylesheet" href="../base.css">
  <style>
    .go {
      background: white;
      height: 25rem;
      margin: 1rem;
      padding: 5rem;
      transition: all 0.2s;
      width: 25rem;

      &.circle {
        border-radius: 50%;
      }

      &.red {
        background: red;
      }

      &.purple {
        background: purple;
      }

      &.fadeOut {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="go">Click Me</div>

  <script>
    let go = document.querySelector('.go');

    go.addEventListener('click', function(e) {
      const el = e.currentTarget;
      console.log(el);
      el.textContent = 'GO!';

      setTimeout(function() {
        el.classList.add('circle');

        setTimeout(function() {
          el.classList.add('red');

          setTimeout(() => {
            el.classList.remove('circle');

            setTimeout(() => {
              el.classList.remove('red');
              el.classList.add('purple');

              setTimeout(() => {
                el.classList.add('fadeOut');
              }, 300);

            }, 300);

          }, 250);

        }, 500);

      }, 2000);
    });

    // console.log('Starting');

    // setTimeout(function() {
    //   console.log('Running');
    // }, 2000);

    // setInterval(function Boop() {
    //   console.log('Boop');
    // }, 100);

    // console.log('Ending');
  </script>
</body>

</html>
